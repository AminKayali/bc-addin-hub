name: Catalog

on:
  pull_request:
    paths:
      - "addins/**"
      - "scripts/**"
      - "CATALOG.md"
  push:
    branches: [main]
    paths:
      - "addins/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and catalog
        run: node scripts/build-catalog.mjs --check

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build catalog
        run: node scripts/build-catalog.mjs
      - name: Commit catalog if changed
        run: |
          if [ -n "$(git status --porcelain CATALOG.md catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CATALOG.md catalog.json
            git commit -m "chore: update catalog"
            git push
          fi
